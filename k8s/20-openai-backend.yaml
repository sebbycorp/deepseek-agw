# OpenAI backend + the /v1 route that DeepSeek Harness calls.
#
# Standalone equivalent: the `llm.models` block in ../agentgateway.yaml.
#
# The real OpenAI key lives in the `openai-secret` Secret, read from the
# `Authorization` key. That Secret is NOT in this repo — create it from your
# shell (install.sh does it, or see ../docs/kubernetes.md).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openai
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai: {}
  policies:
    auth:
      secretRef:
        name: openai-secret
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/models": Models
        "*": Passthrough
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openai
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: openai
          group: agentgateway.dev
          kind: AgentgatewayBackend
