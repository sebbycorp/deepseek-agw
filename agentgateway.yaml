# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# Sample standalone config. No secrets.
# OPENAI_API_KEY lives in the agentgateway process env only (sourced by start-agw.sh).

config:
  adminAddr: localhost:14010
  statsAddr: "[::]:14030"
  readinessAddr: "[::]:14031"
  modelCatalog:
    - file: ./costs/catalog.json
  tracing:
    otlpEndpoint: http://localhost:4317
    randomSampling: true

gateways:
  default:
    port: 4002

llm:
  models:
    - name: "*"
      provider: openAI
      params:
        apiKey: "$OPENAI_API_KEY"
